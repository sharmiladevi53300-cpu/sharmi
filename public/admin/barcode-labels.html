<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barcode Label Printing - Admin Panel</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .barcode-panel-grid {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 20px;
      margin-top: 16px;
    }
    @media (max-width: 850px) {
      .barcode-panel-grid {
        grid-template-columns: 1fr;
      }
    }
    .print-sheet-wrapper {
      background: #cbd5e1;
      padding: 24px;
      border-radius: var(--radius-md);
      min-height: 480px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: flex-start;
      align-content: flex-start;
      border: 1px dashed #94a3b8;
    }
    @media print {
      body * {
        visibility: hidden !important;
      }
      #printSheetArea, #printSheetArea * {
        visibility: visible !important;
      }
      #printSheetArea {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        background: #fff !important;
        padding: 0 !important;
        margin: 0 !important;
        border: none !important;
        display: flex !important;
        flex-wrap: wrap !important;
        gap: 2mm !important;
        justify-content: flex-start !important;
      }
    }
  </style>
</head>
<body>
  <div class="main-wrapper" style="min-height: 100vh;">
    <!-- Top Header -->
    <header class="top-navbar" style="background: #1e1b4b; color: white; border-bottom: none;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="font-size: 24px;">🏷️</div>
        <div>
          <div style="font-weight: 700; font-size: 15px; color: #fff;">Barcode Label Printing Center</div>
          <div style="font-size: 11px; color: #a5b4fc;">RETAIL CLOTHING PRICE TAG & BARCODE STICKERS</div>
        </div>
      </div>

      <div class="user-menu">
        <button class="btn btn-outline btn-sm" onclick="window.location.href='index.html'" style="background:#312e81; color:#fff; border-color:#4338ca;">
          🔙 POS Terminal
        </button>
        <button class="btn btn-outline btn-sm" onclick="window.location.href='bills.html'" style="background:#059669; color:#fff; border-color:#10b981; font-weight:700;">
          🧾 Bill Management
        </button>
        <button class="btn btn-outline btn-sm" onclick="window.location.href='products.html'" style="background:#0369a1; color:#fff; border-color:#0284c7;">
          👚 Product Registration
        </button>
        <button class="btn btn-outline btn-sm" onclick="window.location.href='stock-report.html'" style="background:#0891b2; color:#fff; border-color:#06b6d4; font-weight:700;">
          📈 Stock Valuation & Inward
        </button>
        <button class="btn btn-outline btn-sm" onclick="window.location.href='damaged-returns.html'" style="background:#be123c; color:#fff; border-color:#e11d48; font-weight:700;">
          🚨 Damage & Returns
        </button>
        <button class="btn btn-danger btn-sm" onclick="logout()">
          Sign Out 🚪
        </button>
      </div>
    </header>

    <div class="panel-container" style="max-width: 1200px; margin: 20px auto; padding: 0 16px;">
      <div class="barcode-panel-grid">
        
        <!-- Left Controls -->
        <div class="form-card" style="height: fit-content;">
          <h3 style="font-size: 15px; font-weight: 700; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 8px;">
            🏷️ Print Configuration
          </h3>

          <div class="form-group">
            <label for="selectProduct">Select Garment / Product *</label>
            <select id="selectProduct" class="form-control" onchange="onProductSelectChange()">
              <option value="">-- Choose Product --</option>
            </select>
          </div>

          <div class="form-group">
            <label for="labelQty">Number of Stickers to Print *</label>
            <div style="display: flex; gap: 8px;">
              <input type="number" id="labelQty" class="form-control" value="1" min="1" max="500" oninput="renderSheetPreview()">
              <button type="button" class="btn btn-outline btn-sm" onclick="setQtyToStock()" style="white-space: nowrap; font-size: 11px;">
                Match Stock (<span id="stockQtyBadge">0</span>)
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="labelSize">Sticker Dimensions</label>
            <select id="labelSize" class="form-control" onchange="renderSheetPreview()">
              <option value="50x25" selected>50mm x 25mm (Standard 2" x 1" Label)</option>
              <option value="50x35">50mm x 35mm (Medium Retail Tag)</option>
              <option value="38x25">38mm x 25mm (Compact Label)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="shopNameInput">Store / Brand Header</label>
            <input type="text" id="shopNameInput" class="form-control" value="READYMADE SHOP" oninput="renderSheetPreview()">
          </div>

          <div class="form-group" style="margin-bottom: 16px;">
            <label style="margin-bottom: 6px; font-size: 12px; font-weight: 600;">Display Options</label>
            <div style="display: flex; flex-direction: column; gap: 6px; font-size: 12px;">
              <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                <input type="checkbox" id="chkShopName" checked onchange="renderSheetPreview()"> Include Store Name
              </label>
              <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                <input type="checkbox" id="chkPrice" checked onchange="renderSheetPreview()"> Include Price (₹)
              </label>
              <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                <input type="checkbox" id="chkVariant" checked onchange="renderSheetPreview()"> Include Size / Color
              </label>
            </div>
          </div>

          <button type="button" class="btn btn-purple btn-block" onclick="window.print()" style="padding: 12px; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <span>🖨️</span> Print Barcode Labels
          </button>
        </div>

        <!-- Right Preview Sheet -->
        <div class="list-card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <h3 style="font-size: 15px; font-weight: 700; margin: 0;">📄 Print Preview Sheet</h3>
            <div style="font-size: 12px; color: var(--text-muted);" id="sheetCountSummary">Ready to print</div>
          </div>
          <div id="printSheetArea" class="print-sheet-wrapper">
            <!-- Stickers rendered here -->
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="../js/security.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/barcode.js"></script>
  <script>
    // Security Guard
    SecurityEngine.guardPage('ADMIN');

    let allProducts = [];
    let currentSelectedProduct = null;

    async function initPage() {
      const token = localStorage.getItem('rms_auth_token');
      try {
        const list = await AppStore.getProducts(token);
        allProducts = list.filter(p => p.isActive);

        const sel = document.getElementById('selectProduct');
        sel.innerHTML = '<option value="">-- Select a Garment Product --</option>';
        allProducts.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.id;
          opt.textContent = `${p.name} (${p.size || 'Free'}, ${p.color || 'Std'}) - Barcode: ${p.barcode || p.sku} [Stock: ${p.stockQuantity}]`;
          sel.appendChild(opt);
        });

        // Check if product ID passed in URL param
        const urlParams = new URLSearchParams(window.location.search);
        const prodId = urlParams.get('id');
        if (prodId && allProducts.some(p => p.id === prodId)) {
          sel.value = prodId;
        } else if (allProducts.length > 0) {
          sel.value = allProducts[0].id;
        }

        onProductSelectChange();
      } catch (err) {
        console.error('Failed to load products', err);
      }
    }

    function onProductSelectChange() {
      const selId = document.getElementById('selectProduct').value;
      currentSelectedProduct = allProducts.find(p => p.id === selId) || null;

      if (currentSelectedProduct) {
        document.getElementById('stockQtyBadge').textContent = currentSelectedProduct.stockQuantity || 1;
      } else {
        document.getElementById('stockQtyBadge').textContent = '0';
      }

      renderSheetPreview();
    }

    function setQtyToStock() {
      if (currentSelectedProduct) {
        document.getElementById('labelQty').value = currentSelectedProduct.stockQuantity || 1;
        renderSheetPreview();
      }
    }

    function renderSheetPreview() {
      const sheet = document.getElementById('printSheetArea');
      const summary = document.getElementById('sheetCountSummary');

      if (!currentSelectedProduct) {
        sheet.innerHTML = '<div style="width: 100%; text-align: center; color: #64748b; padding-top: 80px;">Please select a garment product on the left to preview barcode labels.</div>';
        summary.textContent = 'No product selected';
        return;
      }

      const qty = parseInt(document.getElementById('labelQty').value, 10) || 1;
      const size = document.getElementById('labelSize').value;
      const shopName = document.getElementById('shopNameInput').value || 'READYMADE SHOP';
      const showShop = document.getElementById('chkShopName').checked;
      const showPrice = document.getElementById('chkPrice').checked;
      const showVariant = document.getElementById('chkVariant').checked;

      summary.textContent = `Showing ${qty} label sticker${qty > 1 ? 's' : ''} (${size}mm)`;

      const labelsHtml = BarcodeEngine.generateLabelHTML(currentSelectedProduct, {
        shopName,
        size,
        quantity: qty,
        showShop,
        showPrice,
        showVariant
      });

      sheet.innerHTML = labelsHtml;
    }

    function logout() {
      SecurityEngine.clearSession();
      window.location.href = '../admin-login.html';
    }

    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
